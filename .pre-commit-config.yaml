repos:

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: f368fb366ff7f2f808dd324b83a6d32267799e19  # frozen: v0.17.2
  hooks:
    - id: ruff-check
    - id: ruff-format

- repo: https://github.com/adamchainz/blacken-docs
  rev: fda77690955e9b63c6687d8806bafd56a526e45f  # frozen: 1.20.0
  hooks:
    - id: blacken-docs
      additional_dependencies: [black==26.10.1]

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-merge-conflict
  - id: check-yaml
  - id: requirements-txt-fixer
  - id: trailing-whitespace
  - id: debug-statements

# Validate our github workflow files
- repo: https://github.com/python-jsonschema/check-jsonschema
  rev: 0494aa7fa1314e98913a41227d8f0a515b2c1049  # frozen: 0.38.2
  hooks:
    - id: check-github-workflows

- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f # frozen: v1.31.1
  hooks:
    - id: zizmor
      args: ["--pedantic"]

- repo: https://github.com/ansys/pre-commit-hooks
  rev: 55c5b6a5439abd847613579c6924da750e8b78b2  # frozen: v0.8.0
  hooks:
    - id: add-license-headers
      files: '/.*\.(yml|py)$'
      args:
      - --start_year=2022
      exclude: '^(.github|doc)/.*'
