name: |
  Generate a robots.txt file for a website.

description: |
  This process creates a ``robots.txt`` file, which enhances the search
  engine's browsing experience of our documentation. The process is a private
  composite action that is executed as a component of the PyAnsys documentation
  deployment strategies.

  Emits a wildcard-based rule so that only ``/version/stable/`` is crawled,
  regardless of the set of deployed versions. Callers can extend the deny list
  with ``custom-path``.

inputs:

  # Required inputs

  cname:
    description: |
      The canonical name (CNAME) containing the documentation.
    required: true
    type: string

  custom-path:
    description: |
      An additional subdirectory path to disallow for web crawlers. Pass an
      empty string when no extra disallow rule is needed.
    required: true
    type: string

runs:
  using: "composite"
  steps:

    # ------------------------------------------------------------------------

    - uses: ansys/actions/_logging@main
      with:
        level: "INFO"
        message: >
          Generate a wildcard-based robots.txt so that only /version/stable/
          is crawled, regardless of the set of deployed versions.

    - name: "Write the robots.txt file"
      shell: bash
      run: |
        rm -f robots.txt
        cat > robots.txt <<'EOF'
        # managed-by: ansys/actions/_doc-gen-robots
        # Manual edits are overwritten on the next documentation deploy.

        User-agent: *
        Disallow: /version/
        Allow: /version/stable/
        Disallow: /pull/
        EOF

    - name: "Disallow crawling of the custom path"
      if: inputs.custom-path != ''
      shell: bash
      env:
        CUSTOM_PATH: ${{ inputs.custom-path }}
      run: |
        echo "Disallow: /${CUSTOM_PATH}/" >> robots.txt

    - name: "Include the location of the sitemap.xml file"
      shell: bash
      env:
        CNAME: ${{ inputs.cname }}
      run: |
        echo "" >> robots.txt
        echo "Sitemap: https://${CNAME}/sitemap.xml" >> robots.txt
        echo "----- robots.txt -----"
        cat robots.txt
