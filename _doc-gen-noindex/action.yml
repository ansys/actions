name: >
  Inject noindex meta tags into HTML pages that must not be indexed.

description: |
  This process injects ``<meta name="robots" content="noindex, follow" />``
  into every HTML page under the target directory, except pages under a
  ``stable/`` subdirectory. The ``noindex`` directive removes the page from
  the search index while ``follow`` still lets search engines walk links to
  the canonical stable version, so link equity is preserved.

  The ``ansys/actions/doc-deploy-{dev,stable}`` deployment actions use this
  helper twice per deploy:

  - Once with ``version-directory: version`` to stamp every non-stable
    documentation version.
  - Once with ``version-directory: pull`` to stamp every pull-request preview
    (``pull/<pr>/``). The ``ansys/actions/_pr-doc-deployment`` action also
    runs it at PR-preview deploy time.

  This action is a private composite action executed as a component of the
  PyAnsys documentation deployment strategies. It complements
  ``_doc-gen-robots`` (which prevents crawling) and ``_doc-gen-canonical``
  (which points to the stable counterpart).

inputs:

  # Required inputs

  version-directory:
    description: >
      Relative path to the directory containing the version pages of the
      website. The ``stable`` subdirectory of this path is always skipped.
    required: true
    type: string

runs:
  using: "composite"
  steps:

    # ------------------------------------------------------------------------

    - uses: $/_logging
      with:
        level: "INFO"
        message: >
          Injecting noindex meta tags into non-stable documentation pages.

    - name: "Inject noindex meta tags into non-stable pages"
      shell: bash
      env:
        VERSION_DIRECTORY: ${{ inputs.version-directory }}
      run: |
        # Strip any trailing slash so the ``! -path "$version_dir/stable/*"``
        # filter below matches ``version/stable/foo.html`` rather than the
        # non-existent ``version//stable/foo.html`` that a caller-supplied
        # trailing slash would produce.
        version_dir="${VERSION_DIRECTORY%/}"

        if [[ -z "$version_dir" || ! -d "$version_dir" ]]; then
          echo "Skipping noindex injection: directory '${VERSION_DIRECTORY}' does not exist."
          exit 0
        fi

        inject_noindex() {
            local file=$1
            if ! grep -q '</head>' "$file"; then
                return
            fi

            # Strip any pre-existing robots meta so re-runs stay idempotent and
            # a stale ``index`` directive cannot override our noindex. Perl is
            # used (rather than ``sed``) for two reasons:
            #   * ``-0777`` slurps the whole file so multi-line ``<meta ...>``
            #     tags are matched.
            #   * ``/i`` (case-insensitive) works on both GNU and BSD builds,
            #     while ``sed``'s ``/I`` flag is a GNU extension.
            perl -0777 -i -pe 's#<meta[^>]*name\s*=\s*["\x27]robots["\x27][^>]*/?>##gi' "$file"

            local tag='  <meta name="robots" content="noindex, follow" />'
            sed -i "/<\/head>/i\\${tag}" "$file"
            echo "Ensured noindex robots meta in $file"
        }
        export -f inject_noindex

        find "$version_dir" -type f -name "*.html" \
            ! -path "$version_dir/stable/*" \
            -exec bash -c 'inject_noindex "$0"' {} \;
