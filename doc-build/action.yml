name: |
  Documentation build action

description: |
  Build library documentation using `Sphinx
  <https://www.sphinx-doc.org/en/master/>`_. The action installs documentation
  dependencies provided either in a requirement file, e.g.
  ``requirements/requirements_doc.txt``, or in the ``[doc]`` section of the
  additional dependencies in the ``pyproject.toml`` file. Assuming that
  `sphinx-build
  <https://www.sphinx-doc.org/en/master/man/sphinx-build.html>`_ is available
  after installing the documentation dependencies, the action uses it
  to generate documentation from the source. It requires that all the
  documentation is contained in the ``doc/`` directory of a project. Depending
  on the operating system, the action locates the ``doc/Makefile``
  (resp. ``doc/make.bat``) file for Linux (resp. Windows) and runs the
  ``make html`` (resp. ``make.bat html``) command. PDF generation can be
  disabled for non-tag builds using the ``build-pdf`` input.

  .. important:: **Required GitHub Permissions**

     - **contents**: ``read`` - Required to checkout repository code when the repository is not public

inputs:

  # Optional inputs

  python-version:
    description: |
      Python version used for installing and running ``Sphinx``.
    default: '3.12'
    required: false
    type: string

  use-python-cache:
    description: |
      Whether to use the Python cache for installing previously downloaded
      libraries. If ``true``, previously downloaded libraries are installed from the
      Python cache. If ``false``, libraries are downloaded from the PyPI index.
    required: false
    default: true
    type: boolean

  sphinxopts:
    description: |
      Set of options to pass to the ``Sphinx`` builder. Default options include
      using the maximum number of cores in the CPU of the machine and treating
      warnings as errors.

      .. note::

        This will override the ``SPHINXOPTS`` declared in your Makefile.

    default: '-j auto -W --keep-going'
    required: false
    type: string

  dependencies:
    description: |
      String of system dependencies to be installed before building the
      documentation of the project.
    default: ''
    required: false
    type: string

  skip-dependencies-cache:
    description: |
      Whether to ignore dependencies cache or not - for OS libraries.
    required: true
    default: false
    type: boolean

  requires-xvfb:
    description: |
      Whether to install `X Virtual Frame Buffer (XVFB)
      <https://www.x.org/releases/X11R7.6/doc/man/man1/Xvfb.1.xhtml>`_ and run
      the whole test session using XVFB. The default value is ``false``.

      If ``true``, installs `X Virtual Frame Buffer (XVFB)
      <https://www.x.org/releases/X11R7.6/doc/man/man1/Xvfb.1.xhtml>`_ and
      runs the whole test session using XVFB. Default value is ``false``.

      .. warning::

        This option is not taken into account when runner ``os`` is ``'Windows'``.

    default: false
    required: false
    type: boolean

  skip-install:
    description: |
      Whether to skip the installation of the project. The default is ``false``.
      Pure documentation projects require that this action be set to ``false``
      because there is no Python library associated with the project.
    default: false
    required: false
    type: boolean

  requirements-file:
    description: |
      Path to the requirements file in case it needs to be in a specific location.
      This is useful for non python projects, where you don't necessarily have a requirements
      file in the root of the project.
    default: 'requirements/requirements_doc.txt'
    required: false
    type: string

  checkout:
    description: |
      Whether to clone the repository in the CI/CD machine. Default value is
      ``true``.
    default: true
    required: false
    type: boolean

  checkout-lfs:
    description: |
      Whether to download Git LFS-tracked files during the checkout step.
      Enable this when the repository stores documentation assets tracked with
      Git LFS. Only applies when ``checkout`` is ``true``. Default value is ``false``.
    default: false
    required: false
    type: boolean

  check-links:
    description: |
      Whether to perform external link checks during the generation of
      documentation. Default value is ``true``.
    default: true
    required: false
    type: boolean

  add-pdf-html-docs-as-assets:
    description: |
      Whether to add PDF and HTML documentation as assets of the HTML
      documentation. The HTML documentation is compressed before being added.
      The PDF file name is expected to be the same as the project name defined
      in the pyproject.toml file. Default value is ``false``.

      .. warning::

        The HTML files are expected to be contained in ``doc/_build`` and the
        PDF file is copied in ``doc/_build/html/_static/assets/download``.
        If such directories do not exist in your repo, the action will fail.

    default: false
    required: false
    type: boolean

  needs-quarto:
    description: >
      Whether to add a Quarto cheatsheet to the documentation. Default value is
      ``false``.

      .. warning::

        Quarto needs Jupyter to be installed. Make sure to add `Jupyter <https://pypi.org/project/jupyter/>` to
        the requirements list.

    default: false
    required: false
    type: boolean

  use-uv:
    description: >
      Whether to use uv as the default package manager instead of pip. Default value is ``true``.
    default: true
    required: false
    type: boolean

  optional-dependencies-name:
    description: |
      Any valid install targets/extras defined in the ``pyproject.toml`` file, or the suffix
      of a requirement file. Multiple targets can be specified as a comma-separated
      list (space-separated for poetry-based projects). The associated dependencies are installed
      before building the documentation. Default value is ``''``. If neither this nor
      ``group-dependencies-name`` is provided, the action defaults to ``doc``.
    default: ''
    required: false
    type: string

  group-dependencies-name:
    description: |
      Any valid dependency groups defined in the ``pyproject.toml`` file. Multiple
      targets can be specified as a comma-separated list. The associated dependencies
      are installed before running the documentation build. Default value is ``''``.
      If neither this nor ``optional-dependencies-name`` is provided, the action
      defaults to using ``optional-dependencies-name=doc``.
    default: ''
    required: false
    type: string

  uploaded-artifact-name-prefix:
    description: |
      A prefix prepended to the name of the uploaded html and pdf artifacts.
      The full name is ``<prefix>-html`` and ``<prefix>-pdf`` for the html and
      pdf artifacts respectively. Default value is `documentation`.
    default: 'documentation'
    required: false
    type: string

  skip-python-setup:
    description: |
      Whether to skip the Python setup step performed by
      ``ansys/actions/_setup-python``. If ``true``, the setup step is skipped
      and the Python version already available in the environment is used.
      This is useful when a specific Python installation is already on the
      ``PATH`` and the setup step would override it.

      .. warning::

          When this option is enabled, the ``python-version`` input is ignored.
          The Python version already available in the environment is used as-is.

    required: false
    default: false
    type: boolean

  skip-latex-install:
    description: |
      Whether to skip the installation of LaTeX. Default value is ``false``.
    required: false
    default: false
    type: boolean

  build-pdf:
    description: |
      Whether to build and upload the PDF documentation. Default value is ``true``.
      This input cannot be ``false`` when the workflow is triggered by a Git tag,
      because release builds must include the PDF documentation.
    required: false
    default: true
    type: boolean

runs:
  using: "composite"
  steps:

    - name: "Check GitHub permissions"
      uses: $/_check-github-permissions
      with:
        permissions: "contents: read"
        doc-url: "https://actions.docs.ansys.com/version/stable/doc-actions/index.html#doc-build-action"

    - name: "Require PDF documentation for tag builds"
      if: ${{ github.ref_type == 'tag' && inputs.build-pdf == 'false' }}
      uses: $/_logging
      with:
        level: "ERROR"
        message: >
          PDF documentation cannot be disabled when building a release.
          Release builds must include the PDF artifact.

    - name: "Require PDF when adding documentation assets"
      if: ${{ inputs.add-pdf-html-docs-as-assets == 'true' && inputs.build-pdf == 'false' }}
      uses: $/_logging
      with:
        level: "ERROR"
        message: >
          The ``add-pdf-html-docs-as-assets`` input requires PDF generation.
          Set ``build-pdf`` to ``true`` or disable ``add-pdf-html-docs-as-assets``.

    # ------------------------------------------------------------------------

    - name: "Install Git and clone project"
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        lfs: ${{ inputs.checkout-lfs }}
      if: ${{ inputs.checkout == 'true' }}

    - name: "Set up Python ${{ inputs.python-version }}"
      if: ${{ inputs.skip-python-setup == 'false' }}
      uses: $/_setup-python
      with:
        python-version: ${{ inputs.python-version }}
        use-cache: ${{ inputs.use-python-cache }}
        provision-uv: ${{ inputs.use-uv }}
        prune-uv-cache: ${{ inputs.use-python-cache != 'true' }}

    - uses: $/_logging
      if: ${{ inputs.skip-python-setup == 'true' }}
      with:
        level: "INFO"
        message: >
          Skipping Python setup to use system Python.

    # ------------------------------------------------------------------------

    - name: "Resolve dependency inputs"
      id: resolve-deps
      shell: bash
      env:
        OPT_DEPS: ${{ inputs.optional-dependencies-name }}
        GRP_DEPS: ${{ inputs.group-dependencies-name }}
      run: |
        if [[ -z "$OPT_DEPS" && -z "$GRP_DEPS" ]]; then
          echo "resolved-optional=doc" >> $GITHUB_OUTPUT
          echo "resolved-group=" >> $GITHUB_OUTPUT
        else
          echo "resolved-optional=$OPT_DEPS" >> $GITHUB_OUTPUT
          echo "resolved-group=$GRP_DEPS" >> $GITHUB_OUTPUT
        fi

    - uses: $/_logging
      if: ${{ steps.resolve-deps.outputs.resolved-optional != '' && steps.resolve-deps.outputs.resolved-group != '' }}
      with:
        level: "WARNING"
        message: >
          Both 'optional-dependencies-name' and 'group-dependencies-name' are specified.
          Both will be used for installation.

    # ------------------------- Linux system setup -------------------------

    - name: "Collect system dependencies"
      id: needed-dependencies
      if: ${{ runner.os == 'Linux' }}
      env:
        DEPENDENCIES: ${{ inputs.dependencies }}
        REQUIRES_XVFB: ${{ inputs.requires-xvfb }}
      shell: bash
      run: |
        if [[ "$REQUIRES_XVFB" == 'true' ]]; then
          echo "NEEDED_DEPS=$(echo "$DEPENDENCIES xvfb")" >> $GITHUB_OUTPUT
        else
          echo "NEEDED_DEPS=$(echo "$DEPENDENCIES")" >> $GITHUB_OUTPUT
        fi

    - name: "Cache apt packages needed"
      uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
      if: ${{ runner.os == 'Linux' && inputs.skip-dependencies-cache == 'false' && steps.needed-dependencies.outputs.NEEDED_DEPS != '' }}
      with:
        packages: ${{ steps.needed-dependencies.outputs.NEEDED_DEPS }}
        version: 1.0

    - name: "Update apt-get"
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: |
        sudo apt-get update

    - name: "Install system dependencies"
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      env:
        NEEDED_DEPS: ${{ steps.needed-dependencies.outputs.NEEDED_DEPS }}
      run: |
        sudo apt-get install -y $NEEDED_DEPS

    - name: "Install LaTeX"
      if: ${{ runner.os == 'Linux' && inputs.build-pdf == 'true' && inputs.skip-latex-install == 'false' }}
      shell: bash
      run: |
        sudo apt-get install -y texlive-latex-extra latexmk

    - name: Install Quarto and TinyTeX
      if: ${{ runner.os == 'Linux' && inputs.needs-quarto == 'true' }}
      shell: bash
      env:
        QUARTO_VERSION: "1.10.18"
        QUARTO_DEB_SHA256: "4bdf5a17df300003beb2f8f0e4dfe568e2ca0ff91318220c8537d2655015c430"
      run: | # zizmor: ignore[github-env]
        cd /tmp
        curl -sSfL -o quarto-linux-amd64.deb \
          "https://github.com/quarto-dev/quarto-cli/releases/download/v${QUARTO_VERSION}/quarto-${QUARTO_VERSION}-linux-amd64.deb"

        if ! echo "${QUARTO_DEB_SHA256}  quarto-linux-amd64.deb" | sha256sum -c -; then
          echo "Quarto .deb SHA256 mismatch for v${QUARTO_VERSION}"
          exit 1
        fi

        sudo apt-get update
        sudo apt-get install -y ./quarto-linux-amd64.deb

        quarto --version
        quarto install tool tinytex --no-prompt --log-level warning
        echo "$HOME/bin" >> "$GITHUB_PATH"

    - name: "Install Poppler for PDF to PNG conversion"
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y poppler-utils

    # ------------------------ Windows system setup ------------------------

    - uses: $/_logging
      if: ${{ runner.os == 'Windows' }}
      with:
        level: "INFO"
        message: >
          Install Chocolatey to install dependencies.

    - name: Download script and install Chocolatey
      if: ${{ runner.os == 'Windows' }}
      shell: powershell
      run: |  # zizmor: ignore[github-env]
        Set-ExecutionPolicy Bypass -Scope Process -Force
        [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
        iex ((New-Object System.Net.WebClient).DownloadString('https://chocolatey.org/install.ps1'))
        echo "C:\ProgramData\chocolatey\bin" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

    # ------------------------------------------------------------------------

    - uses: $/_logging
      if: ${{ runner.os == 'Windows' }}
      with:
        level: "INFO"
        message: >
          Install system dependencies. Even if no dependencies are provided,
          MiKTeX is installed at user level to build the documentation.

    - name: Collect system dependencies
      id: collect-system-dependencies
      if: ${{ runner.os == 'Windows' }}
      shell: powershell
      env:
        DEPENDENCIES: ${{ inputs.dependencies }}
      run: |
        echo "NEEDED_DEPS=$(echo "$env:DEPENDENCIES")" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Cache Chocolatey packages
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: ${{ runner.os == 'Windows' && ((inputs.skip-dependencies-cache == 'false') && (steps.collect-system-dependencies.outputs.NEEDED_DEPS != '')) }}
      with:
        path: ~\AppData\Local\Temp\chocolatey
        key: choco-${{ steps.collect-system-dependencies.outputs.NEEDED_DEPS }}
        restore-keys: choco

    # The cache holds only the downloaded packages, so they must always be installed.
    - name: Install packages with Chocolatey
      if: ${{ runner.os == 'Windows' && (steps.collect-system-dependencies.outputs.NEEDED_DEPS != '') }}
      shell: powershell
      env:
        NEEDED_DEPS: ${{ steps.collect-system-dependencies.outputs.NEEDED_DEPS }}
      run: |
        $packages = $env:NEEDED_DEPS -split '\s+'
        choco install $packages -y

    # NOTE: LaTeX is needed for the PDF documentation and for the Quarto cheatsheet.
    - name: Install MiKTeX and update PATH with MiKTeX binaries
      if: ${{ runner.os == 'Windows' && ((inputs.build-pdf == 'true' || inputs.needs-quarto == 'true') && inputs.skip-latex-install == 'false') }}
      shell: powershell
      run: | # zizmor: ignore[github-env]
        # NOTE: Declared at script scope so it can be accessed inside function
        $script:userMiKTeX = "$env:LocalAppData\Programs\MiKTeX\miktex\bin\x64"

        function Invoke-MiKTeXCheck {
          param(
            [string]$InstallPath,
            [string]$Level
          )
          Write-Host "MiKTeX already installed at $Level level, using existing installation."
          $miktexVersion = & "$InstallPath\miktex.exe" --version
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Existing MiKTeX installation at $Level level is not working properly, reinstalling it at user level..."
            choco install miktex --params '"/Set:basic /ThisUser"' -y --force
            echo "$script:userMiKTeX" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
          } else {
            Write-Host "Existing MiKTeX installation at $Level level is working properly (version: $miktexVersion)."
            echo "$InstallPath" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
          }
        }

        $systemMiKTeX = "C:\Program Files\MiKTeX\miktex\bin\x64"
        if (Test-Path "$script:userMiKTeX\miktex.exe") {
          Invoke-MiKTeXCheck -InstallPath $script:userMiKTeX -Level "user"
        } elseif (Test-Path "$systemMiKTeX\miktex.exe") {
          Invoke-MiKTeXCheck -InstallPath $systemMiKTeX -Level "system"
        } else {
          Write-Host "MiKTeX is not installed, installing it at user level..."
          choco install miktex --params '"/Set:basic /ThisUser"' -y
          echo "$script:userMiKTeX" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
        }

    - name: "Install Poppler for PDF to PNG conversion"
      if: ${{ runner.os == 'Windows' && (inputs.needs-quarto == 'true') }}
      shell: powershell
      run: | # zizmor: ignore[github-env]
        choco install poppler -y
        echo "C:\Program Files\poppler\bin" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

    - name: "Install quarto for cheatsheet"
      if: ${{ runner.os == 'Windows' && (inputs.needs-quarto == 'true') }}
      shell: powershell
      run: | # zizmor: ignore[github-env]
        choco install quarto -y
        echo "C:\ProgramData\chocolatey\lib\quarto\tools" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

    # ------------------------------------------------------------------------

    - uses: $/_logging
      if: ${{ runner.os == 'Windows' && (inputs.build-pdf == 'true' || inputs.needs-quarto == 'true') }}
      with:
        level: "INFO"
        message: >
          Set up MiKTeX to allow downloading missing packages when building documentation.

    - name: Set up MiKTeX to automatically install packages
      if: ${{ runner.os == 'Windows' && (inputs.build-pdf == 'true' || inputs.needs-quarto == 'true') }}
      shell: powershell
      run: |
        initexmf --set-config-value [MPM]AutoInstall=1

    - name: Install additional packages for MiKTeX (known to be required for Quarto cheatsheet)
      if: ${{ runner.os == 'Windows' && (inputs.needs-quarto == 'true') }}
      shell: powershell
      run: |
        mpm --install lm-math

    # ------------------------------------------------------------------------

    - name: Check Quarto Version
      if: ${{ runner.os == 'Windows' && (inputs.needs-quarto == 'true') }}
      shell: powershell
      run: |
        quarto --version

    # ------------------------------------------------------------------------

    - name: Check input (Windows)
      if: ${{ (runner.os == 'Windows') && (inputs.requires-xvfb == 'true') }}
      uses: $/_logging
      with:
        level: "WARNING"
        message: >
          X virtual framebuffer is not used when building with Windows.

    - uses: $/_logging
      with:
        level: "INFO"
        message: >
          Set up the project environment to build the documentation.

    - name: "Set up project environment"
      id: project-env
      uses: $/_setup-project-env
      with:
        use-uv: ${{ inputs.use-uv }}
        skip-install: ${{ inputs.skip-install }}
        optional-dependencies-name: ${{ steps.resolve-deps.outputs.resolved-optional }}
        group-dependencies-name: ${{ steps.resolve-deps.outputs.resolved-group }}
        requirements-file: ${{ inputs.requirements-file }}

    # ------------------------------------------------------------------------

    - uses: $/_logging
      with:
        level: "INFO"
        message: >
          Build HTML and, when enabled, PDF documentation.

    - name: "Build HTML and optional PDF documentation (Linux)"
      if: ${{ runner.os == 'Linux' }}
      env:
        SPHINXOPTS: ${{ inputs.sphinxopts }}
        CHECK_LINKS: ${{ inputs.check-links }}
        BUILD_PDF: ${{ inputs.build-pdf }}
        REQUIRES_XVFB: ${{ inputs.requires-xvfb }}
        RUN_PREFIX: ${{ steps.project-env.outputs.run-prefix }}
      shell: bash
      run: |
        source .venv/bin/activate
        XVFB_RUN=""
        if [[ "${REQUIRES_XVFB}" == 'true' ]]; then
          XVFB_RUN="xvfb-run"
        fi
        ${XVFB_RUN} ${RUN_PREFIX} make -C doc html SPHINXOPTS="${SPHINXOPTS}"
        if [[ "${BUILD_PDF}" == 'true' ]]; then
          ${XVFB_RUN} ${RUN_PREFIX} make -C doc pdf SPHINXOPTS="${SPHINXOPTS}"
        fi
        if [[ "${CHECK_LINKS}" == 'true' ]]; then
          ${XVFB_RUN} ${RUN_PREFIX} make -C doc linkcheck SPHINXOPTS="${SPHINXOPTS}"
        fi

    - name: "Build HTML and optional PDF documentation (Windows)"
      if: ${{ runner.os == 'Windows' }}
      shell: powershell
      env:
        RUN_PREFIX: ${{ steps.project-env.outputs.run-prefix }}
        CHECK_LINKS: ${{ inputs.check-links }}
        BUILD_PDF: ${{ inputs.build-pdf }}
        SPHINXOPTS: ${{ inputs.sphinxopts }}
      run: |
        .venv\Scripts\Activate.ps1
        cd doc
        function Invoke-Make([string]$Target) {
          $command = @($env:RUN_PREFIX -split '\s+' | Where-Object { $_ }) + @('.\make.bat', $Target, "SPHINXOPTS=$env:SPHINXOPTS")
          & $command[0] @($command | Select-Object -Skip 1)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
        Invoke-Make html
        if ($env:BUILD_PDF -eq 'true') { Invoke-Make pdf }
        if ($env:CHECK_LINKS -eq 'true') { Invoke-Make linkcheck }

    # ------------------------------------------------------------------------

    - uses: $/_logging
      if: ${{ inputs.add-pdf-html-docs-as-assets == 'true' }}
      with:
        level: "INFO"
        message: >
          Set environment variable PDF_FILENAME.

    - name: Parse PDF file name
      if: ${{ inputs.add-pdf-html-docs-as-assets == 'true' }}
      shell: bash
      run: |
        if [[ "${RUNNER_OS}" == 'Windows' ]]; then
          source .venv/Scripts/activate
        else
          source .venv/bin/activate
        fi
        python "${GITHUB_ACTION_PATH}/../python-utils/parse_doc_conf.py"

    - uses: $/_logging
      if: ${{ (inputs.add-pdf-html-docs-as-assets == 'true' ) && (env.PDF_FILENAME == '') }}
      with:
        level: "ERROR"
        message: >
          Unable to determine PDF filename using conf.py file.

    - uses: $/_logging
      if: ${{ (inputs.add-pdf-html-docs-as-assets == 'true' ) && (env.PDF_FILENAME != '') }}
      with:
        level: "INFO"
        message: >
          Environment variable PDF_FILENAME set to ${{ env.PDF_FILENAME }}.

    # ------------------------------------------------------------------------

    - uses: $/_logging
      if: ${{ inputs.add-pdf-html-docs-as-assets == 'true' }}
      with:
        level: "INFO"
        message: >
          Check if expected directories exist.

    - name: Check expected build directory
      id: check-expected-build-dir
      shell: bash
      run: |
        echo "EXISTS_EXPECTED_BUILD_DIR=$( [ -d doc/_build ] && echo 'true' || echo 'false' )" >> "${GITHUB_OUTPUT}"

    - uses: $/_logging
      if: ${{ (inputs.add-pdf-html-docs-as-assets == 'true') && (steps.check-expected-build-dir.outputs.EXISTS_EXPECTED_BUILD_DIR == 'false') }}
      with:
        level: "ERROR"
        message: >
          Expected build directory doc/_build does not exist.

    - name: Check expected download directory
      id: check-expected-download-directory
      if: ${{ inputs.add-pdf-html-docs-as-assets == 'true' }}
      shell: bash
      run: |
        echo "EXISTS_EXPECTED_DOWNLOAD_DIR=$( [ -d doc/_build/html/_static/assets/download ] && echo 'true' || echo 'false' )" >> "${GITHUB_OUTPUT}"

    - uses: $/_logging
      if: ${{ (inputs.add-pdf-html-docs-as-assets == 'true') && (steps.check-expected-download-directory.outputs.EXISTS_EXPECTED_DOWNLOAD_DIR == 'false') }}
      with:
        level: "WARNING"
        message: >
          Expected download directory doc/_build/html/_static/assets/download does not exist. Creating it...

    - name: Create expected download directory
      if: ${{ (inputs.add-pdf-html-docs-as-assets == 'true') && (steps.check-expected-download-directory.outputs.EXISTS_EXPECTED_DOWNLOAD_DIR == 'false') }}
      shell: bash
      run: |
        mkdir -p doc/_build/html/_static/assets/download

    # ------------------------------------------------------------------------

    - name: Verify that documentation has been generated properly
      if: ${{ runner.os == 'Windows' && steps.check-expected-build-dir.outputs.EXISTS_EXPECTED_BUILD_DIR == 'true' }}
      shell: powershell
      env:
        EXPECTED_BUILD_DIR: 'doc\_build'
        BUILD_PDF: ${{ inputs.build-pdf }}
      run: |
        # Check if the HTML files have been generated
        if (Test-Path -Path "${env:EXPECTED_BUILD_DIR}\html\index.html") {
          Write-Host "Documentation has been generated successfully"
        } else {
          Write-Error "Documentation has not been generated properly"
        }
        if ($env:BUILD_PDF -eq 'true') {
          # Check if the PDF files have been generated
          if (Test-Path -Path "${env:EXPECTED_BUILD_DIR}\latex\${env:PDF_FILENAME}") {
            Write-Host "PDF file has been generated successfully"
          } else {
            Write-Error "PDF file has not been generated properly"
          }
        }

    # ------------------------------------------------------------------------

    - uses: $/_logging
      if: ${{ inputs.add-pdf-html-docs-as-assets == 'true' }}
      with:
        level: "INFO"
        message: >
          Add PDF and HTML documentation as assets.

    - name: Compress HTML documentation
      if: ${{ inputs.add-pdf-html-docs-as-assets == 'true' }}
      uses: vimtor/action-zip@5407800dfb2b1b37d48df912330cb22f4ab6f422 # v1.3
      with:
        files: doc/_build/html
        dest: documentation-html.zip

    - name: Add assets to HTML docs
      if: ${{ inputs.add-pdf-html-docs-as-assets == 'true' }}
      shell: bash
      env:
        EXPECTED_BUILD_DIR: doc/_build
        EXPECTED_DOWNLOAD_DIR: doc/_build/html/_static/assets/download
        PDF_FILENAME: ${{ env.PDF_FILENAME }}
      run: |
        mv documentation-html.zip "${EXPECTED_DOWNLOAD_DIR}"
        if [ -e "${EXPECTED_BUILD_DIR}/latex/${PDF_FILENAME}" ]; then
            cp "${EXPECTED_BUILD_DIR}/latex/${PDF_FILENAME}" "${EXPECTED_DOWNLOAD_DIR}"
            echo "File ${EXPECTED_BUILD_DIR}/latex/${PDF_FILENAME} has been copied."
        else
            cp "${EXPECTED_BUILD_DIR}"/latex/*.pdf "${EXPECTED_DOWNLOAD_DIR}"
            echo "Couldn't find ${EXPECTED_BUILD_DIR}/latex/${PDF_FILENAME}, every existing PDF file has been copied."
        fi

    # ------------------------------------------------------------------------

    - name: "Upload HTML documentation artifact"
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.uploaded-artifact-name-prefix }}-html
        path: doc/_build/html
        retention-days: 7

    - name: "Upload PDF documentation artifact"
      if: ${{ inputs.build-pdf == 'true' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.uploaded-artifact-name-prefix }}-pdf
        path: doc/_build/latex/*.pdf
        retention-days: 7
