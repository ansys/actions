[build-system]
requires = [
    "flit_core >=3.2,<4",
]
build-backend = "flit_core.buildapi"

[project]
name = "ansys-actions-flit"
version = "11.0.2"
description = "A demo library for testing Ansys actions (uses flit as the build backend)"
readme = "README.rst"
requires-python = ">=3.12"
license = "MIT"
license-files = [
    "LICENSE",
]
authors = [
    { name = "ANSYS, Inc.", email = "pyansys.core@ansys.com" },
]
maintainers = [
    { name = "PyAnsys developers", email = "pyansys.core@ansys.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "importlib-metadata >=4.0",
]

[project.urls]
Source = "https://github.com/ansys/actions"
Documentation = "https://actions.docs.ansys.com"

[tool.flit.module]
name = "ansys.actions.flit"
