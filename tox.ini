[tox]
description = Automation environments for ansys/actions repository
requires =
    tox-uv>=1
envlist =
    code-style
    tests
    doc-build
skip_missing_interpreters = true
isolated_build = false

[testenv]
description = Base test environment
runner = uv-venv-runner
basepython = python3
setenv =
    PYTHONUNBUFFERED = yes
passenv =
    PIP_EXTRA_INDEX_URL

[testenv:code-style]
runner = uv-venv-lock-runner
description = Run code style checks via prek
skip_install = true
only_groups =
    code-style-prek
uv_sync_flags =
    --frozen
commands =
    prek run --all-files --show-diff-on-failure

[testenv:doc-{clean,links,html}]
runner = uv-venv-lock-runner
description =
    Environment for
    html: html documentation generation
    clean: cleaning previously generated html documentation
    links: verifying the integrity of external links within the documentation
skip_install = true
package = skip
only_groups =
    links,html: doc
uv_sync_flags =
    --frozen
setenv =
    SOURCE_DIR = doc/source
    BUILD_DIR = doc/_build
    BUILDER_OPTS = --color -v -j auto -W --keep-going
    links: BUILDER = linkcheck
    html: BUILDER = html
commands =
    clean: uv run --no-sync python -c "import shutil, sys; shutil.rmtree(sys.argv[1], ignore_errors=True)" "{toxinidir}/doc/_build"
    html,links: uv run --no-sync sphinx-build -d "{toxworkdir}/doc_doctree" {env:SOURCE_DIR} "{toxinidir}/{env:BUILD_DIR}/{env:BUILDER}" {env:BUILDER_OPTS} -b {env:BUILDER}

[testenv:update-tag-references]
description = Update CI/CD version references to a new tag (usage: tox -e update-tag-references -- 10.1.2)
skip_install = true
deps =
    click
    tomli
    tomli_w
commands =
    python {toxinidir}/python-utils/update_tag_references.py {posargs}

[testenv:tests]
runner = uv-venv-lock-runner
description = Run Python utility tests
skip_install = true
package = skip
only_groups =
    tests-pytest
uv_sync_flags =
    --frozen
commands =
    uv run --no-sync pytest -vv {toxinidir}/python-utils {posargs}
