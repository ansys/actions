name: |
  Tests pytest action

description: |
  Run a test suite using `pytest <https://docs.pytest.org/en/stable/>`_.

  .. important:: **Required GitHub Permissions**

     - **contents**: ``read`` - Required to checkout repository code when the repository is not public

inputs:

  # Optional inputs
  python-version:
    description: |
      Python version used for installing and running ``pytest``.
    default: '3.12'
    required: false
    type: string

  use-python-cache:
    description: |
      Whether to use the Python cache for installing previously downloaded
      libraries. If ``true``, previously downloaded libraries are installed from the
      Python cache. If ``false``, libraries are downloaded from the PyPI index.
    required: false
    default: true
    type: boolean

  pytest-markers:
    description: |
      Set of `pytest markers
      <https://docs.pytest.org/en/stable/example/markers.html>`_ in the form of
      a string. These markers are used to discretize tests when running the test
      session.
    default: ''
    required: false
    type: string

  pytest-extra-args:
    description: |
      Set of additional ``pytest`` arguments in the form of a string.
    default: ''
    required: false
    type: string
  pytest-postargs:
    description: |
      Directory of the test suite and the level of verbosity.
    default: 'tests -vv'
    required: false
    type: string

  requires-xvfb:
    description: |
      Whether to install `X Virtual Frame Buffer (XVFB)
      <https://www.x.org/releases/X11R7.6/doc/man/man1/Xvfb.1.xhtml>`_ and run
      the whole test session using XVFB. The default value is ``false``.
    default: false
    required: false
    type: boolean

  checkout:
    description: |
      Whether to clone the repository in the CI/CD machine. Default value is
      ``true``.
    default: true
    required: false
    type: boolean

  checkout-lfs:
    description: |
      Whether to download Git LFS-tracked files during the checkout step.
      Enable this when the repository stores test fixtures tracked with Git LFS
      (reference data, mesh files, binary result files). Only applies when
      ``checkout`` is ``true``. Default value is ``false``.
    default: false
    required: false
    type: boolean

  skip-install:
    description: |
      Skip installation process. This should be set to `false` when using poetry
      as the build-backend because it should be false with poetry as build-backend.
      The default value is ``false``.
    default: false
    required: false
    type: boolean

  optional-dependencies-name:
    description: |
      Any valid install targets/extras defined in the ``pyproject.toml`` file, or the
      suffix of a requirement file. Multiple targets can be specified as a
      comma-separated list (space-separated for poetry-based projects). The associated
      dependencies are installed before running the tests. Default value is ``''``. If
      neither this nor ``group-dependencies-name`` is provided, the action defaults to
      ``tests``.
    default: ''
    required: false
    type: string

  group-dependencies-name:
    description: |
      Any valid dependency groups defined in the ``pyproject.toml`` file. Multiple
      targets can be specified as a comma-separated list. The associated dependencies
      are installed before running the tests. Default value is ``''``. If neither this
      nor ``optional-dependencies-name`` is provided, the action defaults to using
      ``optional-dependencies-name=tests``.
    default: ''
    required: false
    type: string

  randomize:
    description:
      Whether to randomize the order of the tests. The default value is ``false``.
    default: false
    type: boolean

  use-uv:
    description: |
      Whether to use uv as the default package manager instead of pip. Default value is ``true``.
    default: true
    required: false
    type: boolean

  skip-python-setup:
    description: |
      Whether to skip the Python setup step performed by
      ``ansys/actions/_setup-python``. If ``true``, the setup step is skipped
      and the Python version already available in the environment is used.
      This is useful when a specific Python installation is already on the
      ``PATH`` and the setup step would override it.

      .. warning::

          When this option is enabled, the ``python-version`` input is ignored.
          The Python version already available in the environment is used as-is.

    required: false
    default: false
    type: boolean

runs:
  using: "composite"
  steps:

    - name: "Check GitHub permissions"
      uses: $/_check-github-permissions
      with:
        permissions: "contents: read"
        doc-url: "https://actions.docs.ansys.com/version/stable/tests-actions/index.html#test-library-action"

    - name: "Install Git and clone project"
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        lfs: ${{ inputs.checkout-lfs }}
      if: ${{ inputs.checkout == 'true' }}

    # ------------------------------------------------------------------------

    - uses: $/_logging
      with:
        level: "INFO"
        message: >
          Set up python to test.

    - name: "Set up Python ${{ inputs.python-version }}"
      if: ${{ inputs.skip-python-setup == 'false' }}
      uses: $/_setup-python
      with:
        python-version: ${{ inputs.python-version }}
        use-cache: ${{ inputs.use-python-cache }}
        provision-uv: ${{ inputs.use-uv }}
        prune-uv-cache: ${{ inputs.use-python-cache != 'true' }}

    - uses: $/_logging
      if: ${{ inputs.skip-python-setup == 'true' }}
      with:
        level: "INFO"
        message: >
          Skipping Python setup to use system Python.

    # ------------------------------------------------------------------------

    - name: "Resolve dependency inputs"
      id: resolve-deps
      shell: bash
      env:
        OPT_DEPS: ${{ inputs.optional-dependencies-name }}
        GRP_DEPS: ${{ inputs.group-dependencies-name }}
      run: |
        if [[ -z "$OPT_DEPS" && -z "$GRP_DEPS" ]]; then
          echo "resolved-optional=tests" >> $GITHUB_OUTPUT
          echo "resolved-group=" >> $GITHUB_OUTPUT
        else
          echo "resolved-optional=$OPT_DEPS" >> $GITHUB_OUTPUT
          echo "resolved-group=$GRP_DEPS" >> $GITHUB_OUTPUT
        fi

    - uses: $/_logging
      if: ${{ steps.resolve-deps.outputs.resolved-optional != '' && steps.resolve-deps.outputs.resolved-group != '' }}
      with:
        level: "WARNING"
        message: >
          Both 'optional-dependencies-name' and 'group-dependencies-name' are specified.
          Both will be used for installation.

    - name: "Set up project environment"
      id: project-env
      uses: $/_setup-project-env
      with:
        use-uv: ${{ inputs.use-uv }}
        skip-install: ${{ inputs.skip-install }}
        optional-dependencies-name: ${{ steps.resolve-deps.outputs.resolved-optional }}
        group-dependencies-name: ${{ steps.resolve-deps.outputs.resolved-group }}
        requirements-file: requirements/requirements_${{ steps.resolve-deps.outputs.resolved-optional }}.txt

    - name: "Install X Virtual Frame Buffer"
      shell: bash
      if: inputs.requires-xvfb == 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb

    - name: "Set up pytest run command"
      id: pytest-run-command
      shell: bash
      env:
        BUILD_BACKEND: ${{ steps.project-env.outputs.build-backend }}
      run: |
        if [[ "$BUILD_BACKEND" == 'poetry' ]]; then
          echo "PYTEST_RUN=$(echo 'poetry run pytest')" >> $GITHUB_OUTPUT
        elif [[ "$BUILD_BACKEND" == 'uv' ]]; then
          echo "PYTEST_RUN=$(echo 'uv run --no-sync pytest')" >> $GITHUB_OUTPUT
        else
          echo "PYTEST_RUN=$(echo 'python -m pytest')" >> $GITHUB_OUTPUT
        fi

    - name: "Randomize the order of the tests"
      shell: bash
      if: inputs.randomize == 'true'
      env:
        BUILD_BACKEND: ${{ steps.project-env.outputs.build-backend }}
        SKIP_INSTALL: ${{ inputs.skip-install }}
      run: |
        if [[ "${BUILD_BACKEND}" == 'poetry' ]] && [[ "${SKIP_INSTALL}" == 'false' ]]; then
          grep -v '^\s*#' "${GITHUB_ACTION_PATH}/requirements.txt" | grep -v '^\s*$' | grep -v '^\s' | while read -r line; do
            poetry add "${line//\'/\"}" --lock
          done
          poetry install
        elif [[ "${BUILD_BACKEND}" == 'uv' ]]; then
          uv pip install -r ${GITHUB_ACTION_PATH}/requirements.txt
        else
          python -m pip install -r ${GITHUB_ACTION_PATH}/requirements.txt
        fi

    - name: "Executing test suite"
      if: inputs.requires-xvfb == 'false'
      shell: bash
      env:
       PYTEST_MARKERS: ${{ inputs.pytest-markers }}
       PYTEST_EXTRA_ARGS: ${{ inputs.pytest-extra-args }}
       PYTEST_POST_ARGS: ${{ inputs.pytest-postargs }}
       PYTEST_RUN: ${{ steps.pytest-run-command.outputs.PYTEST_RUN }}
       ACTIVATE_VENV: ${{ steps.project-env.outputs.activate-venv }}
      run: |
        ${ACTIVATE_VENV}
        eval "${PYTEST_RUN} ${PYTEST_MARKERS} ${PYTEST_EXTRA_ARGS} ${PYTEST_POST_ARGS}"

    - name: "Executing test suite using xvfb"
      if: inputs.requires-xvfb == 'true'
      shell: bash
      env:
       PYTEST_MARKERS: ${{ inputs.pytest-markers }}
       PYTEST_EXTRA_ARGS: ${{ inputs.pytest-extra-args }}
       PYTEST_POST_ARGS: ${{ inputs.pytest-postargs }}
       PYTEST_RUN: ${{ steps.pytest-run-command.outputs.PYTEST_RUN }}
       ACTIVATE_VENV: ${{ steps.project-env.outputs.activate-venv }}
      run: |
        ${ACTIVATE_VENV}
        eval "xvfb-run ${PYTEST_RUN} ${PYTEST_MARKERS} ${PYTEST_EXTRA_ARGS} ${PYTEST_POST_ARGS}"
