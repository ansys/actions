name: |
  Code style

description: |
  This action evaluates the code quality of your project by using `pre-commit
  <https://github.com/pre-commit/pre-commit/>`_ or `prek
  <https://github.com/j178/prek/>`_ (a faster alternative to pre-commit).
  The action installs and runs the chosen tool depending on the input
  configuration. It is assumed that your project contains a
  ``.pre-commit-config.yaml`` file in the root directory. The action can also
  be extended to lint docker files that are contained in the docker directory
  and the .devcontainer directory.

  .. warning::

    If docker lint is enabled and directories docker or .devcontainer exist,
    the action will fail if it doesn't find a Dockerfile.

  The action can optionally commit and push the fixes applied by the hooks back
  to the branch, replicating the behavior of `pre-commit.ci <https://pre-commit.ci/>`_.
  To enable it, set ``commit-changes`` to ``true`` and provide the ``token``,
  ``bot-user`` and ``bot-email`` inputs. A token other than the default
  ``GITHUB_TOKEN`` is required for the pushed commit to trigger new workflow runs.
  Pull requests coming from forks are skipped, as the token cannot push to them.

  .. important:: **Required GitHub Permissions**

     - **contents**: ``read`` - Required to checkout repository code when the repository is not public
     - **contents**: ``write`` - Required only if ``commit-changes`` is ``true``, to push the fixes


inputs:

  # Optional inputs

  python-version:
    description: |
      Python version used for installing and running ``pre-commit`` or ``prek``.
    default: '3.12'
    required: false
    type: string

  use-python-cache:
    description: |
      Whether to use the Python cache for installing previously downloaded
      libraries. If ``true``, previously downloaded libraries are installed from the
      Python cache. If ``false``, libraries are downloaded from the PyPI index.
    required: false
    default: true
    type: boolean

  use-prek:
    description: |
      Whether to use prek instead of pre-commit. If ``true`` (default), prek will be used
      (faster alternative). If ``false``, pre-commit will be used.
    required: false
    default: true
    type: boolean

  pre-commit-version:  # TODO: Remove deprecated input in v12
    description: |
      DEPRECATED ARGUMENT. The version of pre-commit to install. Only used when ``use-prek`` is ``false``.
    required: false
    default: ''
    type: string

  prek-version:  # TODO: Remove deprecated input in v12
    description: |
      DEPRECATED ARGUMENT. The version of prek to install. Only used when ``use-prek`` is ``true``.
    required: false
    default: ''
    type: string

  docker-lint:
    description: |
      Extend the workflow to lint Dockerfile(s).
    required: false
    default: false
    type: bool

  docker-recursive:
    description: |
      Search for Dockerfile(s) recursively. Only applies to allowed
      directories, i.e. docker and .devcontainer.
    required: false
    default: false
    type: bool

  docker-error-level:
    description: |
      Fail docker-style action based on hadolint output (-1: never, 0: error,
      1: warning, 2: info)
    required: false
    default: 2
    type: int

  skip-install:
    description: |
      Whether to skip the installation of the project or not. If ``true``, the
      project is not installed. If ``false``, the project is installed. By
      default, the project is not installed.
    required: false
    default: true
    type: boolean

  show-diff-on-failure:
    description: |
      Whether to show the diff when a pre-commit/prek hook fails.
    required: false
    default: true
    type: boolean

  use-uv:
    description: |
      Whether to use uv as the default package manager instead of pip. Default value is ``true``.
    default: true
    required: false
    type: boolean

  checkout:
    description: |
      Whether to do a checkout step or not. If ``true``, the checkout step is performed.
      If ``false``, the checkout is skipped allowing the workspace from a prior step to
      be used unaltered. By default it is set to ``true``.
    required: false
    default: true
    type: boolean

  commit-changes:
    description: |
      Whether to commit and push the fixes applied by the pre-commit/prek hooks
      to the checked out branch. If ``true``, the ``token``, ``bot-user`` and
      ``bot-email`` inputs are required. Only changes to already tracked files
      are committed. If ``checkout`` is ``false``, the workspace must have a
      branch checked out (not the pull request merge commit).
    required: false
    default: false
    type: boolean

  token:
    description: |
      Token used to push the commit with the fixes, e.g. the PYANSYS_CI_BOT_TOKEN.
      Required if ``commit-changes`` is ``true``. Using the default
      ``GITHUB_TOKEN`` does not trigger new workflow runs on the pushed commit.
    required: false
    default: ''
    type: string

  bot-user:
    description: |
      Username used as the git commit author, e.g. the PYANSYS_CI_BOT_USERNAME.
      Required if ``commit-changes`` is ``true``.
    required: false
    default: ''
    type: string

  bot-email:
    description: |
      Email used as the git commit author, e.g. the PYANSYS_CI_BOT_EMAIL.
      Required if ``commit-changes`` is ``true``.
    required: false
    default: ''
    type: string

  commit-message:
    description: |
      Message of the commit containing the fixes applied by the hooks.
    required: false
    default: 'chore: auto fixes from pre-commit hooks'
    type: string

runs:
  using: "composite"
  steps:

    - name: "Check GitHub permissions"
      uses: $/_check-github-permissions
      with:
        permissions: "contents: read"
        doc-url: "https://actions.docs.ansys.com/version/stable/style-actions/index.html#code-style-action"

    - name: "Determine commit configuration"
      id: commit-config
      if: inputs.commit-changes == 'true'
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
        BOT_USER: ${{ inputs.bot-user }}
        BOT_EMAIL: ${{ inputs.bot-email }}
        EVENT_NAME: ${{ github.event_name }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        REPOSITORY: ${{ github.repository }}
        HEAD_REF: ${{ github.head_ref }}
        REF_NAME: ${{ github.ref_name }}
        REF_TYPE: ${{ github.ref_type }}
      run: |
        if [[ -n "${HEAD_REPO}" ]] && [[ "${HEAD_REPO}" != "${REPOSITORY}" ]]; then
          echo "::warning::Pull request comes from a fork (${HEAD_REPO}). Skipping commit of the fixes."
          echo "COMMIT=false" >> ${GITHUB_OUTPUT}
          exit 0
        fi

        missing=()
        [[ -z "${TOKEN}" ]] && missing+=("token")
        [[ -z "${BOT_USER}" ]] && missing+=("bot-user")
        [[ -z "${BOT_EMAIL}" ]] && missing+=("bot-email")
        if [[ ${#missing[@]} -gt 0 ]]; then
          echo "::error::Input(s) required when 'commit-changes' is 'true': ${missing[*]}"
          exit 1
        fi

        if [[ -n "${HEAD_REF}" ]]; then
          BRANCH="${HEAD_REF}"
        elif [[ "${REF_TYPE}" == 'branch' ]]; then
          BRANCH="${REF_NAME}"
        else
          echo "::error::Unable to determine the branch to push the fixes to (event: ${EVENT_NAME})."
          exit 1
        fi

        echo "COMMIT=true" >> ${GITHUB_OUTPUT}
        echo "BRANCH=${BRANCH}" >> ${GITHUB_OUTPUT}

    - name: "Check GitHub permissions for committing"
      if: steps.commit-config.outputs.COMMIT == 'true'
      uses: $/_check-github-permissions
      with:
        permissions: "contents: write"
        token: ${{ inputs.token }}
        doc-url: "https://actions.docs.ansys.com/version/stable/style-actions/index.html#code-style-action"

    - name: "Install Git and clone project"
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Check out the branch rather than the merge commit so that fixes can be pushed
        ref: ${{ steps.commit-config.outputs.BRANCH }}
        persist-credentials: false
      if: ${{ inputs.checkout == 'true' }}

    # ------------------------------------------------------------------------

    - uses: $/_logging
      if: inputs.pre-commit-version != '' || inputs.prek-version != ''
      with:
        level: "WARNING"
        message: >
          The ``pre-commit-version`` and ``prek-version`` inputs are deprecated and will be
          removed in v12.

    - uses: $/_logging
      with:
        level: "INFO"
        message: >
          Determine context.

    - name: "Determine GitHub environment variables"
      id: github-environment-variables
      env:
        USE_UV: ${{ inputs.use-uv }}
      shell: bash
      run: |
        if [[ -f "pyproject.toml" ]] && grep -q 'build-backend = "poetry\.core\.masonry\.api"' "pyproject.toml"; then
          echo "BUILD_BACKEND=$(echo 'poetry')" >> ${GITHUB_OUTPUT}
        elif [[ "${USE_UV}" == 'true' ]]; then
          echo "BUILD_BACKEND=$(echo 'uv')" >> ${GITHUB_OUTPUT}
        else
          echo "BUILD_BACKEND=$(echo 'pip')" >> ${GITHUB_OUTPUT}
        fi

    - uses: $/_logging
      with:
        level: "INFO"
        message: >
          Build backend: ${{ steps.github-environment-variables.outputs.BUILD_BACKEND }}

    # ------------------------------------------------------------------------

    - uses: $/_logging
      with:
        level: "INFO"
        message: >
          Set up python to check code style.

    - name: "Set up Python"
      uses: $/_setup-python
      with:
        python-version: ${{ inputs.python-version }}
        use-cache: ${{ inputs.use-python-cache }}
        provision-uv: ${{ inputs.use-uv }}
        prune-uv-cache: ${{ inputs.use-python-cache != 'true' }}

    # NOTE: Installation of poetry in a separate environment to the project to
    # avoid situations in which both poetry and the project have shared
    # dependencies with different version. This can lead to CICD failures. For
    # more information, see https://github.com/ansys/actions/pull/560
    - name: "Add pipx/bin directory to Github Path"
      if: steps.github-environment-variables.outputs.BUILD_BACKEND == 'poetry'
      shell: bash
      run: echo "${RUNNER_TEMP}/pipx/bin" >> $GITHUB_PATH # zizmor: ignore[github-env]

    # NOTE: Poetry uses virtual environments when installing a project. As we
    # want to control that creation, we store POETRY_VIRTUALENVS_CREATE=false
    # in the GitHub environment.
    - name: "Set poetry environment variable(s)"
      if: steps.github-environment-variables.outputs.BUILD_BACKEND == 'poetry'
      shell: bash
      run: echo "POETRY_VIRTUALENVS_CREATE=false" >> $GITHUB_ENV

    # NOTE: Install pipx in a location that can be used in following CICD jobs
    # but ensure that poetry is installed in a temporary folder cleaned before
    # and after each job. This way poetry is kinda "installed at system level"
    # making it available in the following call and installed in a different
    # environment from the project.
    - name: "Install poetry and create a virtual environment"
      if: steps.github-environment-variables.outputs.BUILD_BACKEND == 'poetry'
      shell: bash
      run: |
        python -m pip install pipx
        python -m pipx install poetry
      env:
        PIPX_BIN_DIR: ${{ runner.temp }}/pipx/bin
        PIPX_HOME: ${{ runner.temp }}/pipx/home

    # NOTE: A virtual environment is needed regardless in all cases. In uv's case,
    # the installation speed "uv pip" offers is what needs to be taken advantage of,
    # using "uv venv" in a separate step is not necessary since "uv pip" will still
    # work with existing virtual environments.
    - name: "Create a virtual environment"
      shell: bash
      run: |
        python -m venv .venv

    - name: "Set up virtual environment activation command"
      id: virtual-environment-activation-command
      shell: bash
      run: |
        if [[ ${RUNNER_OS} == 'Windows' ]]; then
          echo "ACTIVATE_VENV=$(echo 'source .venv/scripts/activate')" >> ${GITHUB_OUTPUT}
        else
          echo "ACTIVATE_VENV=$(echo 'source .venv/bin/activate')" >> ${GITHUB_OUTPUT}
        fi

    # ------------------------------------------------------------------------

    - name: "Auto-detect uv lockfile"
      id: auto-detect-uv-lockfile
      if: ${{ inputs.use-uv == 'true' }}
      shell: bash
      run: |
        if [[ -f "uv.lock" ]]; then
          echo "USE_UV_LOCKFILE=true" >> ${GITHUB_OUTPUT}
        else
          echo "USE_UV_LOCKFILE=false" >> ${GITHUB_OUTPUT}
        fi

    - name: "Suppress .python-version file for uv"
      if: ${{ inputs.use-uv == 'true' }}
      shell: bash
      run: |
        if [[ -f ".python-version" ]]; then
          echo ".python-version file detected. Removing it to prevent uv from overriding the Python version."
          rm .python-version
        else
          echo ".python-version file not detected. No action required."
        fi

    - name: "Update pip"
      shell: bash
      env:
        ACTIVATE_VENV: ${{ steps.virtual-environment-activation-command.outputs.ACTIVATE_VENV }}
      run: |
        ${ACTIVATE_VENV}
        python -m pip --disable-pip-version-check install --no-cache-dir --force-reinstall "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"

    - name: "Install project (if required)"
      if: inputs.skip-install == 'false'
      shell: bash
      env:
        BUILD_BACKEND: ${{ steps.github-environment-variables.outputs.BUILD_BACKEND }}
        ACTIVATE_VENV: ${{ steps.virtual-environment-activation-command.outputs.ACTIVATE_VENV }}
        USE_UV_LOCKFILE: ${{ steps.auto-detect-uv-lockfile.outputs.USE_UV_LOCKFILE }}
      run: |
        ${ACTIVATE_VENV}
        if [[ "${BUILD_BACKEND}" == 'poetry' ]]; then
          poetry install
        elif [[ "${BUILD_BACKEND}" == 'uv' ]]; then
          if [[ "${USE_UV_LOCKFILE}" == 'true' ]]; then
            uv sync --frozen
          else
            uv pip install .
          fi
        else
          python -m pip install .
        fi

    - name: "Install action dependencies"
      shell: bash
      env:
        ACTIVATE_VENV: ${{ steps.virtual-environment-activation-command.outputs.ACTIVATE_VENV }}
        BUILD_BACKEND: ${{ steps.github-environment-variables.outputs.BUILD_BACKEND }}
        SKIP_INSTALL: ${{ inputs.skip-install }}
        USE_PREK: ${{ inputs.use-prek }}
        # The action's requirements are pinned and shouldn't inherit the caller's
        # rolling uv exclude-newer policy (e.g. for security-critical certifi pins).
        # This is a temporary fix to be updated in a week
        UV_EXCLUDE_NEWER: "false"
      run: |
        ${ACTIVATE_VENV}
        if [[ "${USE_PREK}" == 'true' ]]; then
          REQUIREMENTS_FILE="${GITHUB_ACTION_PATH}/requirements-prek.txt"
        else
          REQUIREMENTS_FILE="${GITHUB_ACTION_PATH}/requirements-pre-commit.txt"
        fi
        if [[ "${BUILD_BACKEND}" == 'poetry' ]] && [[ "${SKIP_INSTALL}" == 'false' ]]; then
          grep -v '^\s*#' "${REQUIREMENTS_FILE}" | grep -v '^\s*$' | grep -v '^\s' | while read -r line; do
            poetry add "${line//\'/\"}" --lock
          done
          poetry install
        elif [[ "${BUILD_BACKEND}" == 'uv' ]]; then
          uv pip install -r ${REQUIREMENTS_FILE}
        else
          pip install -r ${REQUIREMENTS_FILE}
        fi

    - name: "Run pre-commit"
      id: run-pre-commit
      if: inputs.use-prek == 'false'
      shell: bash
      env:
        SHOW_DIFF_ON_FAILURE: ${{ inputs.show-diff-on-failure }}
        ACTIVATE_VENV: ${{ steps.virtual-environment-activation-command.outputs.ACTIVATE_VENV }}
      run: |
        $ACTIVATE_VENV
        if [[ "${SHOW_DIFF_ON_FAILURE}" == 'true' ]]; then
          pre-commit run --all-files --show-diff-on-failure
        else
          pre-commit run --all-files
        fi

    - name: "Run prek"
      id: run-prek
      if: inputs.use-prek == 'true'
      shell: bash
      env:
        SHOW_DIFF_ON_FAILURE: ${{ inputs.show-diff-on-failure }}
        ACTIVATE_VENV: ${{ steps.virtual-environment-activation-command.outputs.ACTIVATE_VENV }}
      run: |
        $ACTIVATE_VENV
        if [[ "${SHOW_DIFF_ON_FAILURE}" == 'true' ]]; then
          prek run --all-files --show-diff-on-failure
        else
          prek run --all-files
        fi

    - name: "Commit and push fixes"
      if: >-
        failure() &&
        steps.commit-config.outputs.COMMIT == 'true' &&
        (steps.run-pre-commit.outcome == 'failure' || steps.run-prek.outcome == 'failure')
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
        BOT_USER: ${{ inputs.bot-user }}
        BOT_EMAIL: ${{ inputs.bot-email }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
        BRANCH: ${{ steps.commit-config.outputs.BRANCH }}
      run: |
        git config user.name "${BOT_USER}"
        git config user.email "${BOT_EMAIL}"

        # Only stage tracked files; .python-version may have been removed by this action
        git add -u -- . ':(exclude).python-version'
        if git diff --staged --quiet; then
          echo "No fixes to commit."
          exit 0
        fi

        git commit -m "${COMMIT_MESSAGE}"

        AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${TOKEN}" | base64 | tr -d '\n')"
        echo "::add-mask::${AUTH_HEADER#AUTHORIZATION: basic }"
        # Reset any persisted credentials before setting the bot token to avoid duplicate headers
        git -c "http.${GITHUB_SERVER_URL}/.extraheader=" \
            -c "http.${GITHUB_SERVER_URL}/.extraheader=${AUTH_HEADER}" \
            push origin "HEAD:refs/heads/${BRANCH}"

    # ------------------------------------------------------------------------

    # Trigger docker-style action if docker-lint is set to true.
    - uses: $/_logging
      if: inputs.docker-lint == 'true'
      with:
        level: "INFO"
        message: >
          Extend the workflow to lint Dockerfile(s).

    - name: "Run Dockerfile linting in directories 'docker' and '.devcontainer'"
      if: inputs.docker-lint == 'true'
      uses: $/docker-style
      with:
        directory: "docker .devcontainer"
        recursive: ${{ inputs.docker-recursive }}
        error-level: ${{ inputs.docker-error-level }}

    # ------------------------------------------------------------------------

    # End action as docker-lint is set to false.
    - uses: $/_logging
      if: ${{ inputs.docker-lint == 'false' }}
      with:
        level: "INFO"
        message: >
          Docker lint disabled.
