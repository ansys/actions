name: Semestrial tooling update issue

on:
  schedule:
    - cron: '0 2 1 1,7 *'

permissions:
  contents: read
  issues: write

jobs:
  open-update-issue:
    name: Open or refresh semestrial tooling update issue
    runs-on: ubuntu-latest
    steps:
      - name: Check for an existing open issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_DATE=$(date +%Y-%m)
          ISSUE_TITLE="chore: review and refresh semestrial tooling versions (${CURRENT_DATE})"

          EXISTING_ISSUE=$(gh issue list \
            --state open \
            --search "$ISSUE_TITLE" \
            --limit 20 \
            --json number,title \
            --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" | head -n 1 || true)

          if [[ -n "$EXISTING_ISSUE" ]]; then
            echo "An open issue already exists: #$EXISTING_ISSUE"
            exit 0
          fi

          printf '%s\n' "$ISSUE_TITLE" > /tmp/tooling-update-title.txt

      - name: Create tooling upgrade issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_DATE=$(date +%Y-%m)
          ISSUE_TITLE="chore: review and refresh semestrial tooling versions (${CURRENT_DATE})"

          cat <<'EOF' > /tmp/tooling-update-issue.md
          Review and refresh the versions of tools used across the repo on a semestrial basis.

          The following tools should be reviewed and updated as necessary:
          - Syft
          - Quarto

          > [!NOTE]
          > This tracking issue is intentionally lightweight and should be reviewed every six months to avoid stale toolchain versions.
          EOF

          gh issue create \
            --title "$ISSUE_TITLE" \
            --label "dependencies,ci" \
            --assignee "@ansys/pyansys-core" \
            --body-file /tmp/tooling-update-issue.md
