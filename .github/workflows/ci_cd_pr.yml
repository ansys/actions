name: pull-request
on:
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  test-python-default:
    name: "Test python default"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12, 3.13, 3.14, 3.15]
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    steps:
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup-python
        with:
          python-version: ${{ matrix.python-version }}

      - name: Log result
        uses: $/_logging
        with:
          level: "INFO"
          message: >
            Environment: ${{ matrix.os }} - Python version installed: ${{ steps.setup-python.outputs.python-version }}
