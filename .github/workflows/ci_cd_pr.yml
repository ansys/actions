name: pull-request
on:
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  test-python-default:
    name: "Test python default"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12, 3.13, 3.14, 3.15]
      fail-fast: false
    steps:
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check python version
        run: python --version

      # Not available by default
      # - name: Check certifi version
      #   run: python -m pip show certifi

      - name: Check pip version
        run: python -m pip --version

      - name: Check venv pip version
        run: |
          python -m venv .venv 
          . .venv/bin/activate
          python -m pip --version
          # python -m pip show certifi

  test-python-custom:
    name: "Test python custom"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [">=3.11.18 <3.12.0", ">=3.12.16 <3.13.0", ">=3.13.18 <3.14.0", ">=3.14.10 <3.15.0", ">=3.15.2"]
      fail-fast: false
    steps:
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check python version
        run: python --version

      # Not available by default
      # - name: Check certifi version
      #   run: python -m pip show certifi

      - name: Check pip version
        run: python -m pip --version

      - name: Check venv pip version
        run: |
          python -m venv .venv 
          . .venv/bin/activate
          python -m pip --version
          # python -m pip show certifi
