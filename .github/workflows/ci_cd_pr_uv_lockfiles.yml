name: Test actions with uv lockfile based projects
on:
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled]

env:
  MAIN_PYTHON_VERSION: '3.12'
  DOCUMENTATION_CNAME: 'actions.docs.ansys.com'
  PIP_EXTRA_INDEX_URL: 'https://${{ secrets.PYANSYS_PYPI_PRIVATE_PAT }}@pkgs.dev.azure.com/pyansys/_packaging/pyansys/pypi/simple/'
  LIBRARY_NAME: ansys-actions-flit

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  check-environment-approval:
    name: Check environment approval uv lockfile
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.block.outputs.environment }}
    steps:

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Decide which environment should be used
        id: block
        uses: ./_check-environment-approval
        with:
          manual-check-environment: 'dependabot'
          skip-manual-check-environment: ''

  # NOTE: We do not allow dependabot to trigger the CI/CD pipeline automatically.
  # This is to mitigate supply chain attacks, where a malicious dependency update
  # could execute arbitrary code in our build environment.
  # Dependabot PRs must be reviewed carefully and approved manually before
  # running the CI.
  check-dependabot:
    name: Manual approval (on dependabot PRs) uv lockfile
    runs-on: ubuntu-latest
    needs: [check-environment-approval]
    environment: ${{ needs.check-environment-approval.outputs.environment }}
    steps:
      - name: Proceed after approval
        if: ${{ needs.check-environment-approval.outputs.environment == 'dependabot'}}
        run: |
          echo "::notice::Workflow approved."
      - name: Approval skipped
        if: ${{ needs.check-environment-approval.outputs.environment == ''}}
        run: |
          echo "::notice::Workflow approval skipped."

  test-build-wheelhouse:
    name: "Test build-wheelhouse action using ansys-actions-flit package"
    runs-on: ${{ matrix.os }}
    needs: check-dependabot
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
      fail-fast: false
    permissions:
      id-token: write # Needed for provenance attestation
      contents: read
      attestations: write # Needed for provenance attestation
    steps:

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: "Build wheelhouse and perform smoke test for ${{ env.LIBRARY_NAME }} package"
        uses: ./build-wheelhouse
        with:
          library-name: ${{ env.LIBRARY_NAME }}
          operating-system: ${{ matrix.os }}
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          working-directory: .ci/${{ env.LIBRARY_NAME }}
          attest-provenance: true
          checkout: false
          use-uv: true

  test-build-library:
    name: "Test build-library action using ansys-actions-flit package"
    runs-on: ubuntu-latest
    needs: test-build-wheelhouse
    permissions:
      id-token: write # Needed for provenance attestation
      contents: read
      attestations: write  # Needed for provenance attestation
    steps:

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: "Build library for ${{ env.LIBRARY_NAME }} package"
        uses: ./build-library
        with:
          library-name: ${{ env.LIBRARY_NAME }}
          attest-provenance: true
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          working-directory: .ci/${{ env.LIBRARY_NAME }}
          use-uv: true
          checkout: false

  test-build-wheelhouse-on-projects:
    name: "Test build-wheelhouse action for ${{ matrix.repository.name }} project on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    needs: check-dependabot
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        repository:
          - name: pyansys-geometry
            library: ansys-geometry-core
          - name: pyaedt
            library: pyaedt
      fail-fast: false
    permissions:
      id-token: write # Needed for provenance attestation
      contents: read
      attestations: write # Needed for provenance attestation
    steps:

      - name: "Install Git and clone ${{ matrix.repository.name }} repository"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          repository: ansys/${{ matrix.repository.name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Clone ansys/actions into a different path"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          path: actions

      - name: "Build wheelhouse and perform smoke test for ${{ matrix.repository.name }}"
        uses: ./actions/build-wheelhouse
        with:
          checkout: false
          library-name: ${{ matrix.repository.library }}
          operating-system: ${{ matrix.os }}
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          attest-provenance: true
          use-uv: true

  test-build-library-on-projects:
    name: "Test build-library action for ${{ matrix.repository.name }} project"
    runs-on: ubuntu-latest
    needs: test-build-wheelhouse-on-projects
    strategy:
      matrix:
        repository:
          - name: pyansys-geometry
            library: ansys-geometry-core
          - name: pyaedt
            library: pyaedt
      fail-fast: false
    permissions:
      id-token: write # Needed for provenance attestation
      contents: read
      attestations: write # Needed for provenance attestation
    steps:

      - name: "Install Git and clone ${{ matrix.repository.name }} repository"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          repository: ansys/${{ matrix.repository.name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Clone ansys/actions into a different path"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          path: actions

      - name: "Build library for ${{ matrix.repository.name }}"
        uses: ./actions/build-library
        with:
          checkout: false
          library-name: ${{ matrix.repository.library }}
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          attest-provenance: true
          use-uv: true

  test-code-style-on-projects:
    name: "Test code-style action (use-prek: ${{ matrix.use-prek }}) for ${{ matrix.repository.name }} project"
    runs-on: ubuntu-latest
    needs: check-dependabot
    strategy:
      matrix:
        use-prek: ['true', 'false']
        repository:
          - name: pyansys-geometry
          - name: pyaedt
      fail-fast: false
    steps:

      - name: "Install Git and clone ${{ matrix.repository.name }} repository"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          repository: ansys/${{ matrix.repository.name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Clone ansys/actions into a different path"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          path: actions

      - name: "Run code style checks for ${{ matrix.repository.name }}"
        uses: ./actions/code-style
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          use-python-cache: false
          use-prek: ${{ matrix.use-prek }}
          checkout: false
          skip-install: false

  doc-build:
    name: "Test doc build"
    runs-on: ${{ matrix.os }}
    needs: check-dependabot
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
      fail-fast: false
    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./doc-build
        with:
          skip-install: true
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          use-python-cache: false
          needs-quarto: true
          uploaded-artifact-name-prefix: documentation-${{ matrix.os }}
          checkout: false

  test-doc-build-pyansys-geometry:
    name: "Test doc-build action for PyAnsys Geometry on ${{ matrix.os.name }}"
    runs-on: ${{ matrix.os.name }}
    needs: doc-build
    permissions:
      contents: read
      packages: read # Needed to pull geometry container image
    strategy:
      matrix:
        os:
          # - name: windows-latest
          #   container-image-tag: ghcr.io/ansys/geometry:core-windows-latest
          #   dependencies: 'pandoc'
          - name: ubuntu-latest
            container-image-tag: ghcr.io/ansys/geometry:core-linux-latest
            dependencies: 'pandoc texlive-xetex texlive-fonts-recommended texlive-fonts-extra texlive-latex-extra texlive-science texlive-luatex lmodern latexmk'
      fail-fast: false
    env:
      ANSRV_GEO_IMAGE_DOCS_TAG: ${{ matrix.os.container-image-tag }}
      ANSRV_GEO_PORT: 700
      ANSRV_GEO_LICENSE_SERVER: ${{ secrets.LICENSE_SERVER }}
      GEO_CONT_NAME: ans_geo
    steps:

      - name: "Install Git and clone pyansys-geometry repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ansys/pyansys-geometry
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up headless display
        uses: pyvista/setup-headless-display-action@5bc8de3bc71fcda7a96439571287a554901541a0 # v4.3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and launch geometry service
        shell: bash
        env:
          GEOMETRY_CONTAINER_EXEC_OPTS: ${{ secrets.GEOMETRY_CONTAINER_EXEC_OPTS }}
        run: |
          docker pull ${ANSRV_GEO_IMAGE_DOCS_TAG}
          docker run --detach --name ${GEO_CONT_NAME} -e LICENSE_SERVER=${ANSRV_GEO_LICENSE_SERVER} -p ${ANSRV_GEO_PORT}:50051 ${ANSRV_GEO_IMAGE_DOCS_TAG} ${GEOMETRY_CONTAINER_EXEC_OPTS}

      - name: "Clone ansys/actions into a different path"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: actions
          persist-credentials: false

      - name: Run Ansys documentation building action
        uses: ./actions/doc-build
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          add-pdf-html-docs-as-assets: true
          needs-quarto: true
          dependencies: ${{ matrix.os.dependencies }}
          sphinxopts: '-j 1 -W --color'
          checkout: false
          uploaded-artifact-name-prefix: pyansys-geometry-documentation-${{ matrix.os.name }}
          skip-dependencies-cache: true
          optional-dependencies-name: ''
          group-dependencies-name: 'doc'

      - name: Stop the Geometry service
        if: always()
        shell: bash
        run: |
          docker stop ${GEO_CONT_NAME}
          docker logs ${GEO_CONT_NAME}
          docker rm ${GEO_CONT_NAME}

  test-doc-build-pyaedt:
    name: "Test doc-build action for PyAEDT on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    needs: doc-build
    permissions:
      contents: read
      packages: read # Needed to pull geometry container image
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false
    steps:

      - name: "Install Git and clone pyaedt repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ansys/pyaedt
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up headless display
        uses: pyvista/setup-headless-display-action@5bc8de3bc71fcda7a96439571287a554901541a0 # v4.3

      - name: "Clone ansys/actions into a different path"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: actions
          persist-credentials: false

      - name: Run Ansys documentation building action
        uses: ./actions/doc-build
        with:
          dependencies: "graphviz texlive-latex-extra latexmk texlive-xetex texlive-fonts-extra"
          skip-install: true
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          use-python-cache: false
          sphinxopts: '-j auto --color -w build_errors.txt'
          check-links: false
          needs-quarto: false
          optional-dependencies-name: 'all'
          group-dependencies-name: 'doc'

  test-check-licenses-on-projects:
    name: "Test check-licenses action for ${{ matrix.repository.name }} project"
    runs-on: ubuntu-latest
    needs: test-build-library-on-projects
    strategy:
      matrix:
        repository:
          - name: pyansys-geometry
            library: ansys-geometry-core
          - name: pyaedt
            library: pyaedt
      fail-fast: false
    steps:

      - name: "Install Git and clone ${{ matrix.repository.name }} repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ansys/${{ matrix.repository.name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Clone ansys/actions into a different path"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: actions

      - name: "Check license validity for ${{ matrix.repository.name }}"
        uses: ./actions/check-licenses
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          checkout: false
