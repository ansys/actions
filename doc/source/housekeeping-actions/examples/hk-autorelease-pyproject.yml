hk-autorelease:
  name: "Release from pyproject.toml without lockfile regeneration"
  runs-on: ubuntu-latest
  permissions:
    contents: write
    pull-requests: write
  steps:
    - name: "Auto release"
      uses: ansys/actions/hk-autorelease@{{ version }}
      with:
        release-type: ${{ '{{ inputs.release_type }}' }}
        cherry-pick-commits: ${{ '{{ inputs.cherry_pick_commits }}' }}
        version-source: pyproject
        version-location: pyproject.toml
        lock-file-tool: none
        token: ${{ '{{ secrets.MY_BOT_TOKEN }}' }}
        bot-username: ${{ '{{ secrets.MY_BOT_USERNAME }}' }}
        bot-email: ${{ '{{ secrets.MY_BOT_EMAIL }}' }}
