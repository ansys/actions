code-style:
  name: "Running code style checks and committing fixes"
  runs-on: ubuntu-latest
  permissions:
    contents: write  # Required to push the fixes applied by the hooks
    pull-requests: write  # Required to comment on issues that cannot be fixed automatically
  steps:
    - name: "Run PyAnsys code style checks"
      uses: ansys/actions/code-style@{{ version }}
      with:
        commit-changes: true
        token: ${{ '{{ secrets.PYANSYS_CI_BOT_TOKEN }}' }}
        bot-user: ${{ '{{ secrets.PYANSYS_CI_BOT_USERNAME }}' }}
        bot-email: ${{ '{{ secrets.PYANSYS_CI_BOT_EMAIL }}' }}
